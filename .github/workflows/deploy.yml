name: Déploiement sur GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      # Calcule automatiquement l'adresse du site :
      #  - dépôt « mon-portfolio »       -> https://utilisateur.github.io/mon-portfolio/
      #  - dépôt « utilisateur.github.io » -> https://utilisateur.github.io/
      - name: Calculer l'adresse du site
        id: site
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          REPO="${GITHUB_REPOSITORY#*/}"
          if [ "${REPO,,}" = "${OWNER}.github.io" ]; then
            echo "base=/" >> "$GITHUB_OUTPUT"
            echo "url=https://${OWNER}.github.io/" >> "$GITHUB_OUTPUT"
          else
            echo "base=/${REPO}/" >> "$GITHUB_OUTPUT"
            echo "url=https://${OWNER}.github.io/${REPO}/" >> "$GITHUB_OUTPUT"
          fi

      - name: Renseigner l'adresse du site (aperçu de partage et SEO)
        run: sed -i "s|__SITE_URL__|${{ steps.site.outputs.url }}|g" src/index.html

      - name: Compiler le portfolio
        run: npx ng build --base-href "${{ steps.site.outputs.base }}"

      - name: Page 404 (identique à l'accueil)
        run: cp dist/portfolio/browser/index.html dist/portfolio/browser/404.html

      - name: Préparer l'artefact Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/portfolio/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Déployer sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
